<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinson Huang | 个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    text-align: center;
    padding: 3rem 2.5rem;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 1.5rem;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    max-width: 560px;
    margin: 1rem;
  }
  .avatar {
    width: 96px;
    height: 96px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: 700;
    color: #fff;
  }
  h1 { font-size: 2.25rem; margin-bottom: 0.75rem; color: #f8fafc; }
  p { font-size: 1.1rem; line-height: 1.8; color: #cbd5e1; margin-bottom: 1.75rem; }
  a {
    display: inline-block;
    padding: 0.75rem 1.75rem;
    border-radius: 999px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(56, 189, 248, 0.4); }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">V</div>
    <h1>Vinson Huang</h1>
    <p>你好，我是 Vinson Huang。</p>
    <a href="https://github.com/VinsonStudio" target="_blank" rel="noopener">访问我的 GitHub</a>
  </main>
</body>
</html>
